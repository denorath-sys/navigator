# Navigator OS — hyprpaper configuration
#
# This file is copied via /etc/skel into new users'
# ~/.config/hypr/hyprpaper.conf (see image/Containerfile, Layer 4). The user's
# own copy is NOT OVERWRITTEN by image updates; anyone who wants to change the
# wallpaper simply edits this file.
#
# The image: theme/wallpaper.png → /usr/share/navigator/theme/wallpaper.png
# (Layer 3). CI verifies that the user genuinely sees it by comparing the
# screenshot against this file block by block.

preload = /usr/share/navigator/theme/wallpaper.png

# An empty monitor field = "all monitors". Navigator's target hardware may be
# multi-monitor and monitor names vary by machine ("Virtual-1" in CI's QEMU
# VM); writing a name would not be portable.
wallpaper = , /usr/share/navigator/theme/wallpaper.png

# hyprpaper's own splash logo is off — Navigator has its own identity.
splash = false

# hyprpaper's IPC socket is on: it makes changing the wallpaper at runtime
# possible with `hyprctl hyprpaper ...` (a future Navigator settings UI could
# use this), and it is also how CI asks whether hyprpaper is genuinely up.
ipc = on
