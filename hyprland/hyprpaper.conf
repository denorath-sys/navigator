# Navigator OS — hyprpaper yapılandırması
#
# Bu dosya /etc/skel üzerinden yeni kullanıcıların
# ~/.config/hypr/hyprpaper.conf'una kopyalanır (bkz. image/Containerfile
# Katman 4). Kullanıcının kendi kopyası imaj güncellemelerinde EZİLMEZ;
# duvar kâğıdını değiştirmek isteyen sadece bu dosyayı düzenler.
#
# Görselin kendisi bir depo varlığı değil, build sırasında üretiliyor:
# theme/generate-wallpaper.py → /usr/share/navigator/theme/wallpaper.png
# (Katman 3). Üretici marka renklerini theme/palette.json'dan okuyor,
# yani palet değişirse duvar kâğıdı da değişiyor.

preload = /usr/share/navigator/theme/wallpaper.png

# Boş monitör alanı = "tüm monitörler". Navigator'ın hedef donanımı
# çok monitörlü olabilir ve monitör adları makineye göre değişir
# (CI'daki QEMU VM'inde "Virtual-1"); isim yazmak taşınabilir olmazdı.
wallpaper = , /usr/share/navigator/theme/wallpaper.png

# hyprpaper'ın kendi açılış logosu kapalı — Navigator'ın kendi kimliği var.
splash = false

# hyprpaper'ın IPC soketi açık: `hyprctl hyprpaper ...` ile duvar kâğıdını
# çalışma zamanında değiştirmeyi mümkün kılıyor (ileride bir Navigator
# ayar arayüzü bunu kullanabilir) ve CI'da hyprpaper'ın gerçekten ayakta
# olduğunu sormanın da yolu bu.
ipc = on
