# Navigator OS — Hyprland Yapılandırması (Faz 1 taslağı)
#
# Bu dosya, Navigator masaüstü deneyiminin temel Hyprland ayarlarını içerir.
# Faz 1 kapsamında sadece iskelet/placeholder niteliğindedir; gerçek shell
# (Quickshell/AGS) entegrasyonu shell/ dizininde ilerledikçe burası genişletilecek.

# ---------------------------------------------------------------------------
# Monitor (varsayılan — donanım tespiti sonrası otomatik ayarlanacak)
# ---------------------------------------------------------------------------
monitor=,preferred,auto,1

# ---------------------------------------------------------------------------
# Ortam değişkenleri
# ---------------------------------------------------------------------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# ---------------------------------------------------------------------------
# Otomatik başlatma
# ---------------------------------------------------------------------------
# Navigator shell (Quickshell). Bu yolu image/Containerfile Katman 7
# sağlıyor — kullanıcı yapılandırması değil program kodu olduğu için
# /usr/share altında (bkz. shell/README.md "İmajdaki kurulum yolu").
exec-once = qs -p /usr/share/navigator/shell/shell.qml

# Polkit yetkilendirme ajanı. Ajan çalışmıyorsa GUI'den yetki isteyen
# işlemler (paket yöneticisi, disk bağlama vb.) kullanıcıya hiç soru
# sormadan sessizce reddedilir. mate-polkit, Katman 1'de polkit-gnome
# yerine bilinçli olarak seçilmişti (bkz. Containerfile Katman 1 yorumu).
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# BİLİNÇLİ OLARAK BURADA OLMAYANLAR:
# - waybar: Navigator'ın kendi üst paneli var (shell/Bar.qml). İkisi
#   birlikte çalışırsa iki panel üst üste biner. waybar imajda sadece
#   yedek/karşılaştırma amacıyla duruyor.
# - hyprpaper, hypridle: ikisi de kendi config dosyasını gerektiriyor
#   (hyprpaper.conf / hypridle.conf) ve Navigator henüz ikisini de
#   yazmadı — duvar kağıdı varlığı da yok. Config'siz başlatmak,
#   ilk saniyede pes eden bir daemon demek olurdu.
# - NetworkManager, pipewire, wireplumber: bunlar systemd tarafından
#   yönetiliyor (sistem servisi ve socket ile tetiklenen kullanıcı
#   servisleri); compositor'ın exec-once'ıyla başlatılmazlar.

# ---------------------------------------------------------------------------
# Genel görünüm
# ---------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # theme/palette.json ile senkron: teal vurgu, lacivert taban
    col.active_border = rgba(4fd1c5ee) rgba(8b7cf6ee) 45deg
    col.inactive_border = rgba(1a1f2ecc)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.18
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0b0f1a99)
    }
}

# ---------------------------------------------------------------------------
# Animasyonlar
# ---------------------------------------------------------------------------
animations {
    enabled = true

    bezier = navPulse, 0.16, 1, 0.3, 1
    bezier = navEase, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 4, navPulse, popin 85%
    animation = windowsOut, 1, 4, navEase, popin 85%
    animation = border, 1, 6, navEase
    animation = fade, 1, 4, navEase
    animation = workspaces, 1, 5, navPulse, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ---------------------------------------------------------------------------
# Girdi
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

gestures {
    workspace_swipe = true
}

# ---------------------------------------------------------------------------
# Değişkenler
# ---------------------------------------------------------------------------
$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun

# ---------------------------------------------------------------------------
# Navigator AI Asistan Paneli
# Faz 4'te ai-stack/router'a gerçekten bağlandı — shell/AssistantPanel.qml,
# shell/shell.qml'deki IpcHandler (target: "assistant") üzerinden açılıp
# kapanıyor. `qs ipc call` her zaman VARSAYILAN (config adı geçmeyen) çalışan
# Quickshell örneğini hedefler; Navigator'da tek bir örnek çalıştığından bu
# yeterli.
# ---------------------------------------------------------------------------
bind = $mainMod, SPACE, exec, qs ipc call assistant toggle

# ---------------------------------------------------------------------------
# Temel uygulama kısayolları
# ---------------------------------------------------------------------------
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, F, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# ---------------------------------------------------------------------------
# Odak / pencere yönetimi
# ---------------------------------------------------------------------------
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ---------------------------------------------------------------------------
# Workspace geçişleri (1-10)
# ---------------------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ---------------------------------------------------------------------------
# Fare ile pencere taşıma/boyutlandırma
# ---------------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
