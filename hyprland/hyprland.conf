# Navigator OS — Hyprland configuration (Phase 1 draft)
#
# This file holds the base Hyprland settings of the Navigator desktop
# experience. Within Phase 1 it is only a skeleton/placeholder; it will grow as
# the real shell (Quickshell) integration progresses in the shell/ directory.

# ---------------------------------------------------------------------------
# Monitor (default — will be set automatically after hardware detection)
# ---------------------------------------------------------------------------
monitor=,preferred,auto,1

# ---------------------------------------------------------------------------
# Environment variables
# ---------------------------------------------------------------------------
# The cursor. These two sizes were here on their own for a long time, which
# set how big the cursor is without ever saying which cursor — so it stayed at
# whatever fallback the compositor reached for. The theme is installed by
# image/Containerfile and named in ~/.config/gtk-3.0/settings.ini as well,
# because GTK reads its own setting rather than this variable.
#
# `breeze_cursors` is the directory the package installs, and the directory
# name is what XCursor resolves; the theme calls ITSELF "Breeze Dark" in its
# index.theme, and writing that — or "Breeze" — resolves to nothing.
#
# HYPRCURSOR_THEME is deliberately NOT set: it names a theme in hyprcursor's
# own format, Breeze is an XCursor theme, and Hyprland falls back to
# XCURSOR_THEME by itself. Naming a hyprcursor theme that does not exist would
# only add a failed lookup on every startup.
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Without this, ~/.config/qt6ct/ is read by nothing and Qt applications keep
# their default palette while everything around them is Navigator's. GTK needs
# no equivalent: with no settings daemon running, GTK reads
# ~/.config/gtk-3.0/settings.ini on its own. GTK_THEME is deliberately NOT set
# here — it would override that file and take the choice away from the user.
env = QT_QPA_PLATFORMTHEME,qt6ct

# ---------------------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------------------
# The Navigator shell (Quickshell). Layer 7 of image/Containerfile provides
# it is program code rather than user configuration, so it lives under
# /usr/share (see shell/README.md, "Installation path in the image").
exec-once = qs -p /usr/share/navigator/shell/shell.qml

# The polkit authorisation agent. With no agent running, operations that
# request authorisation from the GUI (package manager, mounting a disk and so
# on) are silently denied without ever asking the user. mate-polkit was
# deliberately chosen over polkit-gnome in Layer 1 (see the Layer 1 comment
# in the Containerfile).
exec-once = /usr/libexec/polkit-mate-authentication-agent-1

# The wallpaper. Up to this point Navigator was showing the stock Hyprland
# wallpaper (the default image + "A day without Hyprland is a day wasted") —
# meaning the desktop looked unbranded. This went unnoticed until the first
# real screenshot was taken; no textual test can see what the wallpaper is.
# Config: ~/.config/hypr/hyprpaper.conf (Katman 4, /etc/skel'den).
# The image: /usr/share/navigator/theme/wallpaper.png (Layer 3).
exec-once = hyprpaper

# DELIBERATELY NOT HERE:
# - waybar: Navigator has its own top panel (shell/Bar.qml). Running both
#   would stack two panels on top of each other. waybar remains in the image
#   only for fallback/comparison purposes.
# - hypridle: it requires its own config file (hypridle.conf), which Navigator
#   has not written yet. Starting it without a config would mean a daemon that
#   gives up in the first second. (hyprpaper was NOT here for the same reason;
#   it went in once both its config and the wallpaper asset existed.)
# - NetworkManager, pipewire, wireplumber: these are managed by systemd (a
#   system service and socket-activated user services); they are not started
#   by the compositor's exec-once.

# ---------------------------------------------------------------------------
# General appearance
# ---------------------------------------------------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    # theme/palette.json ile senkron: teal vurgu, lacivert taban
    col.active_border = rgba(4fd1c5ee) rgba(8b7cf6ee) 45deg
    col.inactive_border = rgba(1a1f2ecc)

    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.18
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(0b0f1a99)
    }
}

# ---------------------------------------------------------------------------
# Animasyonlar
# ---------------------------------------------------------------------------
animations {
    enabled = true

    bezier = navPulse, 0.16, 1, 0.3, 1
    bezier = navEase, 0.25, 0.1, 0.25, 1

    animation = windows, 1, 4, navPulse, popin 85%
    animation = windowsOut, 1, 4, navEase, popin 85%
    animation = border, 1, 6, navEase
    animation = fade, 1, 4, navEase
    animation = workspaces, 1, 5, navPulse, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# ---------------------------------------------------------------------------
# Girdi
# ---------------------------------------------------------------------------
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
    sensitivity = 0
}

# Hyprland 0.51 rewrote gestures: `gestures { workspace_swipe = true }` IS
# GONE, replaced by a `gesture` key that binds the finger/direction/action
# triple individually. On this image (Hyprland 0.51.1) the old block produced
# a real config error — "config option <gestures:workspace_swipe> does not
# exist" — and that error appeared in Hyprland's on-screen error banner. None
# of the textual tests caught it; the first screenshot from the visual
# correctness test is what revealed it.
gesture = 3, horizontal, workspace

# ---------------------------------------------------------------------------
# Variables
# ---------------------------------------------------------------------------
$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun

# ---------------------------------------------------------------------------
# Navigator AI Asistan Paneli
# Genuinely wired to ai-stack/router in Phase 4 — shell/AssistantPanel.qml is
# toggled through the IpcHandler in shell/shell.qml (target: "assistant").
# `qs ipc call` always targets the DEFAULT running Quickshell instance (the one
# with no config name); since Navigator runs a single instance, this
# yeterli.
# ---------------------------------------------------------------------------
bind = $mainMod, SPACE, exec, qs ipc call assistant toggle

# ---------------------------------------------------------------------------
# Basic application shortcuts
# ---------------------------------------------------------------------------
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, Q, exit
bind = $mainMod, F, togglefloating
bind = $mainMod, P, pseudo
bind = $mainMod, J, togglesplit

# ---------------------------------------------------------------------------
# Focus / window management
# ---------------------------------------------------------------------------
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# ---------------------------------------------------------------------------
# Workspace switching (1-10)
# ---------------------------------------------------------------------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ---------------------------------------------------------------------------
# Moving/resizing windows with the mouse
# ---------------------------------------------------------------------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
