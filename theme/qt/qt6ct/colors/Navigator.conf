# Navigator OS — Qt6 colour scheme.
#
# Read by qt6ct, which is what makes non-Qt-Quick Qt applications follow the
# Navigator palette. Navigator's own shell is Quickshell and styles itself
# from shell/Theme.qml; this file is for everything else the user runs.
#
# A Qt colour scheme is three lists of 21 colours in QPalette::ColorRole
# order, as #AARRGGBB. It cannot express a formula, which is why the
# interface shades live in theme/palette.json ("ui") as literal hexes rather
# than being computed here — that keeps GTK and Qt reading the same numbers.
#
# Role order (0-20):
#   WindowText Button Light Midlight Dark Mid Text BrightText ButtonText
#   Base Window Shadow Highlight HighlightedText Link LinkVisited
#   AlternateBase NoRole ToolTipBase ToolTipText PlaceholderText
#
# Colours used, all from theme/palette.json:
#   text #e6ecf5   text_muted #97a3b8   surface #121826
#   surface_alt #0f1522   border #1d2740
#   navy #0b0f1a   teal #4fd1c5   purple #8b7cf6   gold #e8d9a8

[ColorScheme]
active_colors=#ffe6ecf5, #ff0f1522, #ff1d2740, #ff121826, #ff0b0f1a, #ff0f1522, #ffe6ecf5, #ffe8d9a8, #ffe6ecf5, #ff121826, #ff0b0f1a, #ff0b0f1a, #ff4fd1c5, #ff0b0f1a, #ff4fd1c5, #ff8b7cf6, #ff0f1522, #ff0b0f1a, #ff121826, #ffe6ecf5, #ff97a3b8
inactive_colors=#ffe6ecf5, #ff0f1522, #ff1d2740, #ff121826, #ff0b0f1a, #ff0f1522, #ffe6ecf5, #ffe8d9a8, #ffe6ecf5, #ff121826, #ff0b0f1a, #ff0b0f1a, #ff1d2740, #ffe6ecf5, #ff4fd1c5, #ff8b7cf6, #ff0f1522, #ff0b0f1a, #ff121826, #ffe6ecf5, #ff97a3b8
