# Navigator OS — GTK3 settings.
#
# The dark preference is the important line: Navigator's palette is a night
# sky, and a GTK app that picks the light Adwaita variant will ignore the
# colour overrides in gtk.css for half its widgets and look wrong next to the
# rest of the desktop.
#
# The icon and cursor themes are named here and installed by Layer 1 of
# image/Containerfile; the boot test cross-checks the names against what is in
# the image, because a settings file naming a theme that is not installed
# behaves exactly like one naming a theme that is. The cursor previously had a
# size and no name at all, which left it wherever the compositor's fallback
# happened to land.
#
# Installed to ~/.config/gtk-3.0/settings.ini via /etc/skel, so the user can
# change it and image updates will not overwrite their choice.

[Settings]
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita-dark
gtk-icon-theme-name=Papirus-Dark
gtk-cursor-theme-name=Breeze
gtk-cursor-theme-size=24
gtk-enable-animations=1
