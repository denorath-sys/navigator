# Navigator OS — the container storage configuration the image build runs with
#
# Pointed at by CONTAINERS_STORAGE_CONF in build-image.yml.
#
# What this file is NOT: it is not what fixed the 45-minute builds. That was
# fixed by calling buildah directly instead of through
# redhat-actions/buildah-build, which exports
# STORAGE_OPTS=overlay.mount_program=fuse-overlayfs and offers no way to
# decline — every layer then gets committed through a FUSE process in user
# space, which for two rpm-ostree layers' worth of small files cost 685s and
# 856s per commit where the same commits now take seconds.
#
# The runner's own /etc/containers/storage.conf names the same mount program:
#
#   [storage.options.overlay]
#   mount_program = "/usr/local/bin/fuse-overlayfs"
#
# so overriding it looked equally necessary. It is not. Measured on the same
# runner, same truncated Containerfile, the only difference being whether this
# file was used: 150s with it, 150s without (run 32086319422). A rootless
# build does not take that option from the system configuration; the env var
# is what reaches it.
#
# So this file is a pin, not a repair, and it is kept as one deliberately.
# The thing that broke the build was an invisible change to a configuration
# the project does not own, arriving with a runner image; there is a rootless
# storage.conf under $HOME that would apply if it existed, and today it does
# not. Naming the storage configuration in the repository means the next such
# change cannot be silent. It is measured to cost nothing, and the duration
# check in build-image.yml is the guard that does not depend on this file
# being right.
#
# graphroot/runroot are deliberately not set: the runner's file names paths
# under /var that only root can write, and letting the rootless defaults under
# $HOME apply is what keeps this usable without sudo. mountopt is not copied
# either — "fsync=0" is a fuse-overlayfs option and the kernel driver has no
# use for it. ignore_chown_errors is kept: a Fedora image carries ids beyond
# the runner's rootless uid range.

[storage]
driver = "overlay"

[storage.options.overlay]
ignore_chown_errors = "true"
