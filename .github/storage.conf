# Navigator OS — the container storage configuration the image build runs with
#
# Pointed at by CONTAINERS_STORAGE_CONF in build-image.yml. It exists to
# override ONE line in the GitHub runner's own /etc/containers/storage.conf:
#
#   [storage.options.overlay]
#   mount_program = "/usr/local/bin/fuse-overlayfs"
#
# That line routes every layer read and write through a FUSE process in user
# space. Navigator's image is a Fedora Atomic base with two rpm-ostree layers
# on top of it, so a build is hundreds of thousands of small file operations,
# which is exactly the shape FUSE is worst at: builds went from 8-9 minutes to
# over 45, spending the time in the layer commits between steps rather than in
# the RUN commands themselves. Measured, not assumed — see the commit that
# added this file.
#
# The kernel's own overlayfs has worked unprivileged since 5.11 and the
# runners are on 6.17, so the mount program buys nothing here and costs an
# order of magnitude. Rootless still needs ignore_chown_errors, since the
# runner's uid range is smaller than the ids inside a Fedora image.
#
# graphroot/runroot are deliberately NOT set: the runner's file names paths
# under /var that only root can write, and letting the rootless defaults under
# $HOME apply is what makes this usable without sudo. mountopt is not copied
# either — "fsync=0" is a fuse-overlayfs option and the kernel driver rejects
# it.

[storage]
driver = "overlay"

[storage.options.overlay]
ignore_chown_errors = "true"
