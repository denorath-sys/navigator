# Navigator OS — one-off probe of the runner's container storage driver
#
# NOT part of the pipeline. It lives on the diag/ branch only and is deleted
# once the question below is answered; the answer is recorded in the commit
# message that fixes build-image.yml.
#
# The question: the last two image builds (runs 31792786872 and 31796507546,
# 2026-08-14) were killed after 57 and 45 minutes, while every build before
# them — the Ollama layer included — finished in 8-9. The log says the time
# went nowhere near the RUN commands. It went into the LAYER COMMITS between
# them: 685 s after STEP 2, 856 s after STEP 3, and STEP 4, a one-file COPY,
# never finished at all.
#
# The one configuration difference between the last good run and the first bad
# one is a line printed by redhat-actions/buildah-build:
#
#   2026-08-11  Storage driver is not 'overlay', so not overriding storage configuration
#   2026-08-14  Overriding storage mount_program with "fuse-overlayfs" in environment
#
# The action reads /etc/containers/storage.conf and, if the driver there is
# 'overlay', forces buildah to mount every layer through fuse-overlayfs by
# exporting STORAGE_OPTS. Between the two runs GitHub shipped runner image
# 20260810.271, which upgraded Podman 4.9.3 -> 5.8.4; buildah itself is 1.33.7
# in both runs, so the tooling did not change — only what its config says.
#
# That is a plausible story, not a measurement, and a slower disk on the new
# runner would look identical from the outside. So this compares the three
# ways the same build can be run ON THE SAME RUNNER:
#
#   native  rootless buildah, native overlay      (what we believe we had)
#   root    buildah under sudo, native overlay    (the fallback if rootless
#                                                  native overlay is refused)
#   fuse    rootless buildah, fuse-overlayfs      (what we have now)
#
# If all three are slow, the driver is innocent and the runner's disk is the
# problem. If only `fuse` is slow, the fix is to stop letting the action force
# the mount program.
#
# The probe image is deliberately shaped like Navigator's: the real base with
# its real layer stack, one large layer, then a tiny COPY on top of it — that
# last one being the step that hung.

name: Diagnose build storage

on:
  workflow_dispatch: {}
  push:
    branches: [ "diag/**" ]

jobs:
  probe:
    name: Storage probe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Report the runner's container storage configuration
        run: |
          echo "== kernel, cpu, memory"
          uname -a
          nproc
          free -h
          echo
          echo "== disks"
          df -hT
          echo
          echo "== /etc/containers/storage.conf (comments and blanks stripped)"
          grep -vE '^[[:space:]]*(#|$)' /etc/containers/storage.conf || echo "MISSING"
          echo
          echo "== ~/.config/containers/storage.conf (comments and blanks stripped)"
          grep -vE '^[[:space:]]*(#|$)' "$HOME/.config/containers/storage.conf" || echo "MISSING"
          echo
          echo "== tools"
          buildah version | head -3
          podman version | head -3
          command -v fuse-overlayfs && fuse-overlayfs --version || echo "fuse-overlayfs NOT in PATH"
          id

      - name: Measure the three variants
        run: |
          set -uo pipefail

          BASE=ghcr.io/ublue-os/base-main:44

          mkdir -p probe
          printf '%s\n' \
            "FROM $BASE" \
            'RUN dd if=/dev/urandom of=/payload.bin bs=1M count=1024 status=none' \
            'COPY marker.txt /marker.txt' \
            'RUN sha256sum /payload.bin > /payload.sha256' \
            > probe/Containerfile
          echo "navigator storage probe" > probe/marker.txt
          echo "== probe Containerfile"
          cat probe/Containerfile

          : > results.txt

          # variant name, sudo prefix, STORAGE_OPTS value ("" for none)
          measure() {
            variant="$1"
            sudo_prefix="$2"
            storage_opts="$3"

            root="$HOME/probe-$variant"
            $sudo_prefix mkdir -p "$root/root" "$root/runroot"

            # Same buildah invocation the action uses, plus an explicit driver
            # so the three variants differ only where they are meant to.
            set -- --root "$root/root" --runroot "$root/runroot" --storage-driver overlay

            echo "::group::$variant — pull the base (not timed)"
            $sudo_prefix env ${storage_opts:+STORAGE_OPTS="$storage_opts"} \
              timeout 600 buildah "$@" pull "$BASE"
            pull_rc=$?
            echo "::endgroup::"

            echo "::group::$variant — build (timed)"
            start=$SECONDS
            $sudo_prefix env ${storage_opts:+STORAGE_OPTS="$storage_opts"} \
              timeout 600 buildah "$@" bud --no-cache --layers=true --format oci \
              -f probe/Containerfile -t "probe-$variant" probe
            build_rc=$?
            secs=$(( SECONDS - start ))
            echo "::endgroup::"

            # 124 is timeout(1)'s "killed at the cap", which is a result, not
            # an error: it means this variant is slower than the cap.
            echo "$variant pull_rc=$pull_rc build_rc=$build_rc seconds=$secs" | tee -a results.txt

            $sudo_prefix rm -rf "$root"
            df -h /home | tail -1
          }

          # Worst suspect last, so a job-level timeout cannot cost us the
          # measurements that are cheap and expected to succeed.
          measure native ""     ""
          measure root   "sudo" ""
          measure fuse   ""     "overlay.mount_program=$(command -v fuse-overlayfs)"

          echo "== results"
          cat results.txt

      - name: Summary
        if: always()
        run: |
          {
            echo "### Storage probe"
            echo
            echo '```'
            cat results.txt 2>/dev/null || echo "no results (the job died before the measurements)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
