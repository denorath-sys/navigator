# Navigator OS — Disk İmajı Build & VM Boot Testi (Faz 3)
#
# build-image.yml tarafından ghcr.io'ya push edilmiş Navigator container
# imajını bootc-image-builder ile gerçek bir qcow2 disk imajına çevirir,
# sonra bu disk imajını GitHub Actions runner'ının KVM'i ile GERÇEKTEN
# boot edip SSH üzerinden sistemin ayağa kalktığını doğrular — bu, Faz
# 1-2'de statik incelemeyle sınırlı kalan hyprland.conf/mcp-tools
# Hyprland araçları gibi parçaların ilk kez gerçek bir compositor/Fedora
# ortamında (kısmen) doğrulanacağı adım.
#
# Yerel ortamda ÇALIŞTIRILMAZ — GitHub'ın kendi runner'ında (ücretsiz,
# ubuntu-24.04'ten beri /dev/kvm destekli) çalışır. Sadece manuel
# tetikleme (workflow_dispatch) ile başlar; build-image.yml'nin aksine
# main'e her push'ta otomatik çalışmaz — daha ağır bir işlem olduğundan
# tetikleme kararı proje sahibine bırakıldı.

name: Build Disk Image & Boot Test

on:
  workflow_dispatch: {}

env:
  IMAGE_NAME: navigator
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  DEFAULT_TAG: latest
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder:latest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-disk:
    name: Disk imajı build et (qcow2)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Ortamı hazırla
        run: |
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "USER_UID=${USER_UID}" >> "${GITHUB_ENV}"
          echo "USER_GID=${USER_GID}" >> "${GITHUB_ENV}"

      - name: Boot testi için tek kullanımlık SSH anahtarı üret
        run: ssh-keygen -t ed25519 -N "" -f boot-test-key -C "navigator-boot-test"

      - name: disk.toml oluştur (bu run'a özel SSH public key ile)
        run: |
          mkdir -p disk_config
          {
            echo '[[customizations.filesystem]]'
            echo 'mountpoint = "/"'
            echo 'minsize = "20 GiB"'
            echo ''
            echo '[[customizations.user]]'
            echo 'name = "navtest"'
            echo 'groups = ["wheel"]'
            echo "key = \"$(cat boot-test-key.pub)\""
            echo ''
            echo '[[customizations.user]]'
            echo 'name = "root"'
            echo "key = \"$(cat boot-test-key.pub)\""
          } > disk_config/boot-test.toml

      - name: ghcr.io'ya giriş yap
        uses: redhat-actions/podman-login@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: qcow2 disk imajı build et
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/boot-test.toml
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: qcow2
          rootfs: btrfs

      - name: Disk imajını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: navigator-disk-image
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 1

      - name: SSH anahtarını ayrı bir artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: navigator-boot-test-ssh-key
          path: boot-test-key
          if-no-files-found: error
          retention-days: 1

  boot-test:
    name: VM'i boot et ve SSH ile doğrula
    needs: build-disk
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Disk imajı artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: navigator-disk-image
          path: ./disk-output

      - name: SSH anahtarı artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: navigator-boot-test-ssh-key
          path: ./disk-output

      - name: QEMU + OVMF kur
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf openssh-client netcat-openbsd

      - name: KVM erişimini doğrula
        run: |
          ls -l /dev/kvm
          sudo usermod -aG kvm "$USER"

      - name: SSH anahtar iznini düzelt
        run: |
          KEY="$(find ./disk-output -name boot-test-key)"
          chmod 600 "${KEY}"
          echo "SSH_KEY=${KEY}" >> "${GITHUB_ENV}"

      - name: VM'i KVM ile arka planda boot et
        run: |
          set -euo pipefail
          QCOW2="$(find ./disk-output -name '*.qcow2' | head -n1)"

          # Ubuntu 24.04'ten itibaren ovmf paketi dosyaları
          # OVMF_CODE.fd/OVMF_VARS.fd değil, *_4M.fd olarak veriyor —
          # ilk çalıştırmada gerçek hatayla yakalandı ("No such file or
          # directory"). Sürüm/isimlendirme değişikliklerine dayanıklı
          # olmak için find ile buluyoruz.
          OVMF_CODE="$(find /usr/share/OVMF -iname 'OVMF_CODE*.fd' | grep -vi secboot | sort | head -n1)"
          OVMF_VARS_SRC="$(find /usr/share/OVMF -iname 'OVMF_VARS*.fd' | grep -vi secboot | sort | head -n1)"
          echo "OVMF_CODE=${OVMF_CODE}"
          echo "OVMF_VARS_SRC=${OVMF_VARS_SRC}"
          cp "${OVMF_VARS_SRC}" ./OVMF_VARS.fd
          sg kvm -c "
            nohup qemu-system-x86_64 \
              -machine accel=kvm,type=q35 \
              -cpu host \
              -smp 2 \
              -m 4096 \
              -nographic \
              -drive if=pflash,format=raw,readonly=on,file=${OVMF_CODE} \
              -drive if=pflash,format=raw,file=$(pwd)/OVMF_VARS.fd \
              -drive file=${QCOW2},format=qcow2,if=virtio \
              -netdev user,id=net0,hostfwd=tcp::2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              > qemu.log 2>&1 &
            disown
            echo \$! > qemu.pid
          "
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 2222; then
              echo "SSH portu açık."
              exit 0
            fi
            sleep 5
          done
          echo "SSH portu 5 dakika içinde açılmadı." >&2
          cat qemu.log || true
          exit 1

      - name: SSH ile sistemin gerçekten ayağa kalktığını doğrula
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5"
          STATE=""
          for i in $(seq 1 24); do
            STATE="$(ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 navtest@127.0.0.1 "systemctl is-system-running" 2>/dev/null || true)"
            echo "systemctl is-system-running -> ${STATE:-<yanıt yok>}"
            case "${STATE}" in
              running|degraded) break ;;
            esac
            sleep 5
          done
          case "${STATE}" in
            running|degraded) ;;
            *)
              echo "Sistem 2 dakika içinde ayağa kalkmadı (son durum: ${STATE:-yok})" >&2
              exit 1
              ;;
          esac
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 navtest@127.0.0.1 \
            "cat /etc/os-release && echo --- && systemctl --failed --no-legend"

      - name: VM'i temizle
        if: always()
        run: |
          if [ -f qemu.pid ]; then
            PID="$(cat qemu.pid)"
            kill "${PID}" 2>/dev/null || true
            sleep 2
            kill -9 "${PID}" 2>/dev/null || true
          fi
          cat qemu.log || true

  hyprland-test:
    name: Hyprland'ı VM'de gerçekten başlat, mcp-tools ve Quickshell'i test et
    needs: build-disk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Deneysel — boot-test'in aksine başarısızlığı workflow'u kırmasın,
    # sonucu logdan okuyup değerlendireceğiz (bkz. commit mesajı).
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Disk imajı artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: navigator-disk-image
          path: ./disk-output

      - name: SSH anahtarı artifact'ını indir
        uses: actions/download-artifact@v4
        with:
          name: navigator-boot-test-ssh-key
          path: ./disk-output

      - name: QEMU + OVMF kur
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf openssh-client netcat-openbsd

      - name: KVM erişimini doğrula
        run: |
          ls -l /dev/kvm
          sudo usermod -aG kvm "$USER"

      - name: SSH anahtar iznini düzelt
        run: |
          KEY="$(find ./disk-output -name boot-test-key)"
          chmod 600 "${KEY}"
          echo "SSH_KEY=${KEY}" >> "${GITHUB_ENV}"

      - name: Hyprland test betiğini oluştur
        run: |
          cat > hyprland-test.sh <<'SCRIPT'
          #!/bin/bash
          set -uo pipefail
          export XDG_RUNTIME_DIR=/run/user/0
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          # Üçüncü gerçek denemede (--i-am-really-stupid eklendikten sonra)
          # Hyprland "CBackend::create() failed!" ile çöktü. aquamarine
          # kaynağında (Session.cpp) doğrulandı: DRM backend, libseat
          # üzerinden bir "seat" açmaya çalışıyor (CSession::attempt).
          # SSH ile bağlanılan bir kabuğun systemd-logind'de gerçek bir
          # seat'i olmuyor, bu yüzden libseat'in logind backend'i
          # başarısız oluyor → DRM backend hiç başlamıyor → GBM allocator
          # kurulamıyor → start() false dönüyor. Çözüm: seatd'yi kendimiz
          # arka planda başlatıp LIBSEAT_BACKEND=seatd ile libseat'i
          # logind yerine doğrudan seatd'ye yönlendirmek (seatd, VT/seat
          # kavramı olmadan root için cihaz erişimini kendi yönetir).
          if command -v seatd >/dev/null 2>&1; then
            echo "=== seatd başlatılıyor ==="
            setsid nohup seatd > /root/seatd.log 2>&1 < /dev/null &
            disown
            sleep 2
            cat /root/seatd.log || true
            export LIBSEAT_BACKEND=seatd
          else
            echo "UYARI: seatd bulunamadı — imajda paket eksik olabilir, DRM backend muhtemelen yine başarısız olacak."
          fi

          echo "=== Hyprland başlatılıyor ==="
          # Hyprland gerçek testte kasıtlı olarak root'u reddetti:
          # "[ ERROR ] Hyprland was launched with superuser privileges,
          # but the privileges check is not omitted." — kaynak kodda
          # (src/main.cpp) doğrulanan tam bayrak: --i-am-really-stupid.
          setsid nohup Hyprland --i-am-really-stupid > /root/hyprland.log 2>&1 < /dev/null &
          disown
          sleep 10

          echo "=== Hyprland log ==="
          cat /root/hyprland.log || true

          echo "=== hypr instance dizini ==="
          ls -la "$XDG_RUNTIME_DIR/hypr/" 2>&1 || echo "(hypr dizini yok)"

          HYPR_SIG="$(ls "$XDG_RUNTIME_DIR/hypr/" 2>/dev/null | head -n1)"
          if [ -z "$HYPR_SIG" ]; then
            echo "HATA: Hyprland instance signature bulunamadı — Hyprland başlamamış."
            exit 1
          fi
          export HYPRLAND_INSTANCE_SIGNATURE="$HYPR_SIG"
          echo "HYPRLAND_INSTANCE_SIGNATURE=$HYPR_SIG"

          echo "=== hyprctl monitors ==="
          hyprctl monitors || { echo "HATA: hyprctl monitors başarısız"; exit 1; }

          echo "=== hyprland.conf'un gerçekten yüklendiğini doğrula ==="
          # Bu repodaki hyprland/hyprland.conf, "mcp-tools kodunu... kopyala"
          # adımında /root/.config/hypr/hyprland.conf'a kopyalandı — Hyprland'ın
          # varsayılan arayacağı yer. Şimdiye kadar bu dosya sadece statik
          # olarak incelenmişti (bkz. hyprland/README.md); burada gerçek
          # compositor'ın onu parse edip uyguladığını hyprctl getoption ile
          # doğruluyoruz — sadece "çökmedi" değil, config'teki gerçek
          # değerlerin gerçekten etkili olduğunu kontrol ediyoruz.
          echo "--- config error/parse uyarıları (varsa) ---"
          grep -i "config error\|syntax error" /root/hyprland.log || echo "(yok)"

          CONFIG_OK=1
          check_option() {
            local option="$1" expected="$2"
            local actual
            actual="$(hyprctl getoption "$option" -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          for k in ("int", "str", "float", "bool"):
              if k in d:
                  v = d[k]
                  print(str(v).lower() if isinstance(v, bool) else v)
                  break
          ' 2>/dev/null)"
            if [ "$actual" = "$expected" ]; then
              echo "OK: $option = $actual"
            else
              echo "HATA: $option beklenen '$expected', gerçek '$actual'"
              CONFIG_OK=0
            fi
          }
          # Bunların hepsi hyprland.conf'ta varsayılandan farklı değerler
          # (border_size varsayılanı 1, rounding varsayılanı 0,
          # resize_on_border varsayılanı false, blur:passes varsayılanı 1,
          # touchpad:natural_scroll varsayılanı false — kaynakta
          # ConfigValues.cpp'de doğrulandı) — bu yüzden eşleşmeleri
          # gerçekten config'in yüklendiğinin kanıtı, varsayılan değerle
          # tesadüfi çakışma değil.
          #
          # Not: ilk gerçek CI denemesinde bool tipi seçeneklerin
          # `hyprctl getoption -j` çıktısında "bool": true/false değil,
          # "int": 1/0 olarak döndüğü görüldü (kaynak koduyla eşleşmeyen
          # ama gerçek çalışan binary'nin gerçek davranışı) — beklenen
          # değerler buna göre düzeltildi.
          check_option general:border_size 2
          check_option decoration:rounding 10
          check_option input:touchpad:natural_scroll 1
          check_option decoration:blur:passes 2
          check_option general:resize_on_border 1

          echo "--- mainMod+RETURN -> kitty bind'i yüklendi mi ---"
          if hyprctl binds -j | python3 -c '
          import json, sys
          binds = json.load(sys.stdin)
          found = any(b.get("key") == "RETURN" and b.get("modmask") and "kitty" in b.get("arg", "") for b in binds)
          sys.exit(0 if found else 1)
          '; then
            echo "OK: mainMod+RETURN -> kitty bind'i bulundu"
          else
            echo "HATA: mainMod+RETURN -> kitty bind'i bulunamadı"
            CONFIG_OK=0
          fi

          if [ "$CONFIG_OK" -ne 1 ]; then
            echo "HATA: hyprland.conf beklenen şekilde yüklenmedi."
            exit 1
          fi

          echo "=== mcp-tools ile gerçek araç çağrısı (imajdaki yoldan) ==="
          # Katman 5'ten beri mcp-tools imajın kendisinde; artık VM'e
          # kopyalanmıyor, /usr/share/navigator/ai-stack/mcp-tools'tan
          # (salt-okunur /usr) çalıştırılıyor.
          cd /usr/share/navigator/ai-stack/mcp-tools
          python3 -c "
          from mcp_tools.hyprland import list_windows, list_workspaces, active_window
          import json
          print('list_windows:', json.dumps(list_windows()))
          print('list_workspaces:', json.dumps(list_workspaces()))
          print('active_window:', json.dumps(active_window()))
          "

          echo "=== Quickshell'i Hyprland'ın kendi exec-once'ı başlattı mı ==="
          # ARTIK ELLE BAŞLATMIYORUZ. hyprland.conf'a exec-once eklendiğinden
          # Quickshell'i compositor'ın kendisi başlatıyor; elle de
          # başlatsaydık ikinci bir örnek olurdu ve `qs ipc` çağrılarının
          # hangi örneğe gittiği belirsizleşirdi. Böylece bu adım artık
          # otomatik başlatmanın gerçekten çalıştığını da doğruluyor.
          #
          # Quickshell, Hyprland'ın çocuğu olarak başladığı için
          # WAYLAND_DISPLAY'i compositor'dan miras alıyor — bizim elle
          # export etmemize gerek kalmadı. Kendi kabuğumuz için yine de
          # gerekiyor (aşağıdaki qs ipc çağrıları).
          WAYLAND_SOCK="$(ls "$XDG_RUNTIME_DIR" 2>/dev/null | grep -E '^wayland-[0-9]+$' | head -n1)"
          if [ -z "$WAYLAND_SOCK" ]; then
            echo "HATA: Wayland soketi bulunamadı — Quickshell test edilemiyor."
            exit 1
          fi
          export WAYLAND_DISPLAY="$WAYLAND_SOCK"
          export QT_QPA_PLATFORM=wayland
          echo "WAYLAND_DISPLAY=$WAYLAND_DISPLAY"

          QS_PATTERN="qs -p /usr/share/navigator/shell/shell.qml"
          for i in $(seq 1 20); do
            if pgrep -f "${QS_PATTERN}" >/dev/null; then
              break
            fi
            sleep 1
          done
          if ! pgrep -af "${QS_PATTERN}"; then
            echo "HATA: Quickshell süreci yok — hyprland.conf'taki exec-once çalışmamış"
            echo "      ya da Quickshell çökmüş olabilir. Hyprland log'u aşağıda."
            echo "--- Hyprland log ---"
            cat /root/hyprland.log || true
            exit 1
          fi
          echo "OK: Quickshell'i Hyprland'ın kendi exec-once'ı başlattı (elle başlatılmadı)."

          echo "=== Polkit ajanı da exec-once ile başladı mı ==="
          # Bu bir iddia değil bilgi: polkit ajanı headless bir VM'de
          # (görünür oturum/seat olmadan) başlamayabilir; masaüstünün
          # gerçek kullanımında önemli ama burada testi düşürmesi anlamsız.
          pgrep -af "polkit-mate-authentication-agent" || echo "(polkit ajanı görünmüyor — headless VM'de beklenebilir)"

          echo "=== hyprctl layers (Quickshell gerçekten bir layer-shell yüzeyi map etti mi) ==="
          hyprctl layers
          if ! hyprctl layers -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          mon = data.get("Virtual-1", {})
          levels = mon.get("levels", {})
          found = any(len(v) > 0 for v in levels.values())
          sys.exit(0 if found else 1)
          '; then
            echo "HATA: Virtual-1 monitöründe hiçbir layer-shell yüzeyi bulunamadı — Bar.qml (PanelWindow) map olmamış olabilir."
            exit 1
          fi
          echo "OK: en az bir layer-shell yüzeyi (Bar.qml/PanelWindow) gerçekten map edildi."

          echo "=== AssistantPanel'i ai-stack/router'a karşı test et (Quickshell IPC) ==="
          # shell.qml'deki IpcHandler (target: "assistant") üzerinden gerçek
          # bir soru soruyoruz — bu, AssistantPanel.qml'in gerçekten
          # /usr/share/navigator/ai-stack/router'ı (bu adıma özel VM'e
          # kopyalandı, bkz. "mcp-tools, hyprland.conf ve shell/ kodunu VM'e
          # kopyala" adımı) subprocess ile çağırdığının kanıtı. CI'da ne Ollama
          # ne Claude API kimlik bilgisi var, bu yüzden router kararı her
          # zaman "cloud"a düşecek (model_ready=false kuralı) ve cloud-bridge
          # "credentials_not_configured" ile graceful şekilde "unavailable"
          # dönecek — bu, gerçek bir uçtan uca hata yolu testi, mock değil.
          #
          # -p buraya ("ipc" alt komutundan hemen sonra) gerekiyor: Quickshell
          # kaynağında (launch/parsecommand.cpp) doğrulandı — Config Selection
          # seçenek grubu "ipc" alt komutuna kayıtlı, "call"a değil. -p'siz
          # çağrı "default" adlı bir config arıyor (bizimki özel bir yolda,
          # /usr/share/navigator/shell/shell.qml) ve "Could not find default config..."
          # hatasıyla sessizce başarısız oluyordu (ilk gerçek denemede görüldü).
          IPC="qs ipc -p /usr/share/navigator/shell/shell.qml call"
          ASK_OUT="$(${IPC} assistant ask "Merhaba, sen kimsin?" 2>&1)"
          ASK_EXIT=$?
          echo "qs ipc call assistant ask -> exit=${ASK_EXIT} çıktı=${ASK_OUT}"

          LOADING="true"
          for i in $(seq 1 30); do
            LOADING="$(${IPC} assistant isLoading)"
            if [ "$LOADING" = "false" ]; then
              break
            fi
            sleep 1
          done
          if [ "$LOADING" != "false" ]; then
            echo "HATA: AssistantPanel 30 saniye içinde yüklenmeyi bitirmedi."
            exit 1
          fi

          RESPONSE="$(${IPC} assistant getResponse)"
          echo "AssistantPanel yanıtı: $RESPONSE"

          echo "=== Hyprland log (assistant testinden SONRA) ==="
          # Quickshell artık exec-once ile Hyprland'ın çocuğu olarak
          # başladığından stdout/stderr'i ayrı bir dosyada değil,
          # compositor'ın log'unda.
          tail -n 40 /root/hyprland.log || true

          case "$RESPONSE" in
            ""|"HATA:"*|"Ayrıştırma hatası"*)
              echo "HATA: AssistantPanel gerçek bir yanıt üretmedi (bkz. yukarıdaki loglar)."
              exit 1
              ;;
          esac
          echo "OK: AssistantPanel gerçekten ai-stack/router'ı çağırdı ve bir yanıt aldı."
          SCRIPT
          chmod +x hyprland-test.sh

      - name: VM'i sanal GPU ile (virtio-gpu + vnc, GL YOK) KVM ile arka planda boot et
        run: |
          set -euo pipefail
          QCOW2="$(find ./disk-output -name '*.qcow2' | head -n1)"
          OVMF_CODE="$(find /usr/share/OVMF -iname 'OVMF_CODE*.fd' | grep -vi secboot | sort | head -n1)"
          OVMF_VARS_SRC="$(find /usr/share/OVMF -iname 'OVMF_VARS*.fd' | grep -vi secboot | sort | head -n1)"
          echo "OVMF_CODE=${OVMF_CODE}"
          cp "${OVMF_VARS_SRC}" ./OVMF_VARS.fd
          # hyprwm/aquamarine#109'da (Kasım-Aralık 2024) tam olarak bu
          # senaryo (Hyprland + virtio-gpu QEMU) kırıktı ("No renderer
          # attached to backend") — PR #121 ile düzeltildi.
          #
          # İkinci denemede: virtio-vga-gl + egl-headless, host'ta hiç
          # GPU/DRM cihazı olmadığından başarısız oldu ("no drm render
          # node available"); vgem modülü de bu runner'ın kernelinde yok
          # ("Module vgem not found"). Host-side GPU/EGL gerektirmeyen bir
          # yola geçildi: düz virtio-gpu-pci (GL YOK, sadece 2D) + -display
          # vnc — VNC display host'ta hiçbir GPU/EGL gerektirmiyor, misafir
          # kendi Mesa/llvmpipe'ıyla (imajda zaten mevcut) 3D/compositing'i
          # tamamen yazılımda yapıyor.
          sg kvm -c "
            nohup qemu-system-x86_64 \
              -machine accel=kvm,type=q35 \
              -cpu host \
              -smp 2 \
              -m 4096 \
              -vga none \
              -device virtio-gpu-pci \
              -display vnc=127.0.0.1:1 \
              -drive if=pflash,format=raw,readonly=on,file=${OVMF_CODE} \
              -drive if=pflash,format=raw,file=$(pwd)/OVMF_VARS.fd \
              -drive file=${QCOW2},format=qcow2,if=virtio \
              -netdev user,id=net0,hostfwd=tcp::2222-:22 \
              -device virtio-net-pci,netdev=net0 \
              > qemu.log 2>&1 &
            disown
            echo \$! > qemu.pid
          "
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 2222; then
              echo "SSH portu açık."
              exit 0
            fi
            sleep 5
          done
          echo "SSH portu 5 dakika içinde açılmadı." >&2
          cat qemu.log || true
          exit 1

      - name: Sistemin ayağa kalktığını doğrula (root ile)
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5"
          STATE=""
          for i in $(seq 1 24); do
            STATE="$(ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 "systemctl is-system-running" 2>/dev/null || true)"
            echo "systemctl is-system-running -> ${STATE:-<yanıt yok>}"
            case "${STATE}" in
              running|degraded) break ;;
            esac
            sleep 5
          done
          case "${STATE}" in
            running|degraded) ;;
            *)
              echo "Sistem 2 dakika içinde ayağa kalkmadı (son durum: ${STATE:-yok})" >&2
              cat qemu.log || true
              exit 1
              ;;
          esac

      - name: Katman 3/4/7 — theme, hyprland.conf ve shell imajda mı, marka renkleri senkron mu
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          SCP="scp ${SSH_OPTS} -i ${SSH_KEY} -P 2222"

          echo "=== Katman 3: /usr/share/navigator/theme/ ==="
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 "ls -la /usr/share/navigator/theme/"
          ${SCP} root@127.0.0.1:/usr/share/navigator/theme/palette.json image-palette.json

          echo "=== Katman 4: /etc/skel/.config/hypr/ ==="
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 "ls -la /etc/skel/.config/hypr/"
          ${SCP} root@127.0.0.1:/etc/skel/.config/hypr/hyprland.conf image-hyprland.conf

          echo "=== Katman 7: /usr/share/navigator/shell/ ==="
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 "ls -la /usr/share/navigator/shell/"
          mkdir -p image-shell
          ${SCP} "root@127.0.0.1:/usr/share/navigator/shell/*.qml" image-shell/

          echo "=== imajdaki dosyalar repodakilerle birebir aynı mı ==="
          if ! cmp -s image-palette.json theme/palette.json; then
            echo "HATA: imajdaki palette.json repodakinden farklı:"
            diff -u theme/palette.json image-palette.json | head -20
            exit 1
          fi
          if ! cmp -s image-hyprland.conf hyprland/hyprland.conf; then
            echo "HATA: imajdaki hyprland.conf repodakinden farklı:"
            diff -u hyprland/hyprland.conf image-hyprland.conf | head -20
            exit 1
          fi
          # shell/'de KAÇ dosya olduğunu da kontrol ediyoruz: sadece var olanları
          # karşılaştırmak, imaja hiç girmemiş bir .qml'i gözden kaçırırdı.
          REPO_QML_COUNT="$(ls shell/*.qml | wc -l)"
          IMAGE_QML_COUNT="$(ls image-shell/*.qml | wc -l)"
          if [ "${REPO_QML_COUNT}" -ne "${IMAGE_QML_COUNT}" ]; then
            echo "HATA: imajda ${IMAGE_QML_COUNT} .qml var, repoda ${REPO_QML_COUNT}:"
            ls shell/*.qml image-shell/*.qml
            exit 1
          fi
          for f in shell/*.qml; do
            if ! cmp -s "$f" "image-shell/$(basename "$f")"; then
              echo "HATA: imajdaki $(basename "$f") repodakinden farklı:"
              diff -u "$f" "image-shell/$(basename "$f")" | head -20
              exit 1
            fi
          done
          echo "OK: palette.json, hyprland.conf ve ${IMAGE_QML_COUNT} .qml dosyası repodakilerle birebir aynı (imaj bayat değil)."

          echo "=== hyprland.conf'taki exec-once hedefleri imajda var mı ==="
          # Yanlış yazılmış ya da paket değişimiyle kaybolmuş bir exec-once,
          # Hyprland tarafından SESSİZCE yutulur: compositor yine de açılır,
          # sadece masaüstü eksik başlar ve hiçbir test kırılmaz. Bu yüzden
          # her exec-once'ın çalıştırılabilirini imajda gerçekten arıyoruz.
          EXECS="$(grep -E '^[[:space:]]*exec-once[[:space:]]*=' image-hyprland.conf | sed -E 's/^[^=]*=[[:space:]]*//' | awk '{print $1}')"
          if [ -z "${EXECS}" ]; then
            echo "HATA: hyprland.conf'ta hiç exec-once yok — en az Navigator shell'i bekleniyordu."
            exit 1
          fi
          for e in ${EXECS}; do
            if ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 \
                 "command -v '$e' >/dev/null 2>&1 || [ -x '$e' ]"; then
              echo "OK: $e"
            else
              echo "HATA: exec-once hedefi '$e' imajda yok ya da çalıştırılabilir değil."
              exit 1
            fi
          done

          echo "=== marka renkleri senkron mu (palette.json tek kaynak) ==="
          # palette.json makine-okunur tek kaynak ama hem hyprland.conf hem
          # shell/Theme.qml aynı hex'leri ELLE tekrar ediyor (ikisi de kendi
          # yorumunda "manuel senkron" diyor). Bu, sessizce sapabilecek bir
          # tekrar — burada gerçekten doğrulanıyor. Katman 7'den beri ÜÇÜ DE
          # (palette.json, hyprland.conf, Theme.qml) imajdan okunuyor.
          python3 - <<'PY'
          import json, re, sys

          palette = json.load(open("image-palette.json"))
          conf = open("image-hyprland.conf").read()
          theme_qml = open("image-shell/Theme.qml").read()

          colors = {k: v["hex"].lstrip("#").lower() for k, v in palette["colors"].items()}
          grad = palette["gradients"]["assistant"]
          stops = [s.lstrip("#").lower() for s in grad["stops"]]
          angle = grad["angle"]
          fails = []

          m = re.search(r"col\.active_border\s*=\s*(.+)", conf)
          if not m:
              fails.append("hyprland.conf'ta col.active_border bulunamadı")
          else:
              line = m.group(1).strip()
              hexes = [h.lower() for h in re.findall(r"rgba\(([0-9a-fA-F]{6})[0-9a-fA-F]{2}\)", line)]
              if hexes != stops:
                  fails.append(f"col.active_border gradyanı uyuşmuyor: conf={hexes} palette={stops}")
              if f"{angle}deg" not in line:
                  fails.append(f"col.active_border açısı uyuşmuyor: conf={line!r} palette={angle}deg")

          m = re.search(r"shadow\s*\{[^}]*?color\s*=\s*rgba\(([0-9a-fA-F]{6})[0-9a-fA-F]{2}\)", conf, re.S)
          if not m:
              fails.append("hyprland.conf'ta shadow color bulunamadı")
          elif m.group(1).lower() != colors["navy"]:
              fails.append(f"shadow color navy ile uyuşmuyor: conf={m.group(1)} palette={colors['navy']}")

          for name in ("teal", "purple", "gold", "navy"):
              if not re.search(rf'property color {name}:\s*"#{colors[name]}"', theme_qml, re.I):
                  fails.append(f"Theme.qml içindeki {name} uyuşmuyor (beklenen #{colors[name]})")

          if fails:
              print("HATA: marka renkleri senkron değil:")
              for f in fails:
                  print("  -", f)
              sys.exit(1)
          print("OK: palette.json <-> hyprland.conf <-> Theme.qml senkron (üçü de imajdan).")
          print(f"    teal={colors['teal']} purple={colors['purple']} gold={colors['gold']} "
                f"navy={colors['navy']}, gradyan açısı={angle}deg")
          PY

          echo "=== Katman 4 yeni kullanıcıya gerçekten ulaşıyor mu (/etc/skel) ==="
          # /etc/skel sadece HESAP OLUŞTURMA anında kopyalanır ve disk.toml'daki
          # navtest kullanıcısını bootc-image-builder oluşturuyor — bib'in bunu
          # useradd/skel yoluyla yaptığı belgelenmiş bir garanti DEĞİL. Bu yüzden
          # ilk turda teşhis olarak ölçüldü (run 30664668160) ve gerçek cevap
          # alındı: navtest'in ev dizini /var/home/navtest ve içinde hem
          # .bashrc/.bash_profile hem .config/hypr/hyprland.conf var — yani skel
          # gerçekten uygulanıyor. Ölçüm kesin sonuç verdiğine göre artık
          # iddia ediliyor: bib veya taban imaj bu davranışı değiştirirse
          # (Katman 4 yeni kullanıcılara ulaşmayı bırakırsa) test kırılsın.
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 \
            "getent passwd navtest; echo ---; ls -la /home/navtest/.config/hypr/ 2>&1"
          if ! ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 \
               "cmp -s /home/navtest/.config/hypr/hyprland.conf /etc/skel/.config/hypr/hyprland.conf"; then
            echo "HATA: navtest'in ev dizinindeki hyprland.conf /etc/skel'dekiyle aynı değil (ya da hiç yok)."
            echo "      Katman 4 yeni kullanıcılara ulaşmıyor — /etc/skel yerine başka bir yol gerekiyor."
            exit 1
          fi
          echo "OK: bootc-image-builder'ın oluşturduğu hesap /etc/skel'i aldı — Katman 4 yeni kullanıcılara gerçekten ulaşıyor."

      - name: Kimlik bilgisi yolu — /etc/skel şablonu ve imajda GERÇEK çözümleme
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          SCP="scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ${SSH_KEY} -P 2222"

          # 1) Şablon imajda repodakiyle birebir aynı mı (imaj bayatsa yakalanır).
          ${SCP} root@127.0.0.1:/etc/skel/.config/navigator/env image-navigator-env
          if ! cmp -s image-navigator-env image/skel/.config/navigator/env; then
            echo "HATA: imajdaki /etc/skel/.config/navigator/env repodakiyle aynı değil."
            diff -u image/skel/.config/navigator/env image-navigator-env || true
            exit 1
          fi
          echo "OK: kimlik bilgisi şablonu imajda ve repodakiyle birebir aynı."

          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 'bash -s' <<'CHECK'
          set -u

          echo "=== İZİNLER: şablon bir sır dosyası olacak, sahibine kapalı olmalı ==="
          stat -c '%n mod=%a sahip=%U:%G' /etc/skel/.config/navigator /etc/skel/.config/navigator/env
          # git dosya modunu saklamadığı için COPY 0644 bırakırdı; Containerfile
          # Katman 4 bunu chmod ile düzeltiyor. Bu iddia, o chmod düşerse
          # (veya bir COPY yeniden sırayı bozarsa) kırılsın diye var:
          # cloud-bridge sahibi dışına açık bir dosyayı BİLEREK reddediyor,
          # yani yanlış mod sessiz değil ama kullanıcıyı doğrudan engeller.
          [ "$(stat -c '%a' /etc/skel/.config/navigator/env)" = "600" ] || {
            echo "HATA: /etc/skel/.config/navigator/env modu 600 değil."; exit 1; }
          [ "$(stat -c '%a' /etc/skel/.config/navigator)" = "700" ] || {
            echo "HATA: /etc/skel/.config/navigator dizin modu 700 değil."; exit 1; }
          echo "OK: şablon 0600, dizini 0700."

          echo "=== TEŞHİS: yeni hesabın kopyası izinleri koruyor mu? ==="
          # Bunun belgelenmiş bir garantisi YOK: /etc/skel'in kopyalandığını
          # ölçtük (bir önceki adım), ama bootc-image-builder'ın kopyalarken
          # dosya MODUNU da koruduğunu ölçmedik. Bu yüzden job'ı düşürmeyen
          # teşhis olarak soruluyor — proje kuralı: önce ölç, sonra iddiaya
          # çevir. Mod korunmasa bile kullanıcı çıkmaza girmez: dosyaya
          # anahtarını yazdığında asistan "chmod 600" demesini söyler.
          ls -la /var/home/navtest/.config/navigator/ 2>&1 || echo "(navtest'te navigator dizini yok)"
          if [ -e /var/home/navtest/.config/navigator/env ]; then
            NAVTEST_MODE=$(stat -c '%a' /var/home/navtest/.config/navigator/env)
            echo "TEŞHİS-SONUÇ: navtest kopyasının modu = ${NAVTEST_MODE} (beklenen 600)"
          else
            echo "TEŞHİS-SONUÇ: navtest kopyası YOK"
          fi

          echo "=== GERÇEK ÇÖZÜMLEME: imajdaki cloud-bridge dosyayı okuyor mu? ==="
          # Sahte bir anahtar yeter: burada test edilen şey kimlik bilgisinin
          # ÇÖZÜMLENMESİ, Claude API'ye gitmek değil (CI'da sır yok ve
          # olmamalı). Ortamdaki her ANTHROPIC_* bilerek siliniyor ki tek
          # olası kaynak dosya olsun — bu, masaüstündeki gerçek yolun aynısı
          # (Quickshell'in ortamında bu değişkenler yok).
          TMPHOME=$(mktemp -d)
          mkdir -p "${TMPHOME}/.config/navigator"
          printf 'ANTHROPIC_API_KEY=sk-ant-ci-sahte\n' > "${TMPHOME}/.config/navigator/env"
          chmod 600 "${TMPHOME}/.config/navigator/env"
          cd /usr/share/navigator/ai-stack/cloud-bridge
          RUN_CB="env -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN -u XDG_CONFIG_HOME HOME=${TMPHOME} python3 -m cloud_bridge"

          OUT=$(${RUN_CB}) || { echo "HATA: cloud_bridge çalışmadı"; exit 1; }
          echo "${OUT}"
          if echo "${OUT}" | grep -q 'sk-ant-ci-sahte'; then
            echo "HATA: kimlik bilgisinin KENDİSİ durum raporuna sızdı."; exit 1
          fi
          echo "${OUT}" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["credentials_configured"] is True, d
          assert d["credentials_source"] == "file", d
          assert d["credentials_file"].endswith("/.config/navigator/env"), d
          assert d["credentials_file_problem"] is None, d
          print("OK: kimlik bilgisi ~/.config/navigator/env dosyasından çözüldü.")
          ' || exit 1

          echo "=== İzinler gevşetilirse dosya REDDEDİLİYOR mu? ==="
          chmod 644 "${TMPHOME}/.config/navigator/env"
          # Önce ağ gerektirmeyen durum raporu: reddetme mantığı bozulmuşsa
          # burada kırılır. Sıra önemli — bu iddia sonra gelseydi, bozuk bir
          # sürümde CI sahte anahtarla api.anthropic.com'a GERÇEK bir istek
          # atardı (yerel sapma denemesinde tam olarak bu görüldü: 401).
          OUT=$(${RUN_CB}) || { echo "HATA: cloud_bridge çalışmadı"; exit 1; }
          echo "${OUT}"
          echo "${OUT}" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["credentials_configured"] is False, d
          assert d["credentials_source"] is None, d
          assert d["credentials_file_problem"] == "insecure_permissions", d
          print("OK: dünyaya okunabilir kimlik bilgisi dosyası reddedildi (sessizce okunmadı).")
          ' || exit 1
          # Ve kullanıcının panelde göreceği sebep dizgesi de doğru olmalı.
          OUT=$(${RUN_CB} --prompt "merhaba") || { echo "HATA: cloud_bridge çalışmadı"; exit 1; }
          echo "${OUT}"
          echo "${OUT}" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["status"] == "unavailable", d
          assert d["reason"] == "credentials_file_insecure", d
          print("OK: reason=credentials_file_insecure (AssistantPanel bunu çeviriyor).")
          ' || exit 1

          echo "=== Dosya yokken graceful mi? ==="
          rm -f "${TMPHOME}/.config/navigator/env"
          OUT=$(${RUN_CB} --prompt "merhaba") || { echo "HATA: cloud_bridge çalışmadı"; exit 1; }
          echo "${OUT}" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          assert d["status"] == "unavailable", d
          assert d["reason"] == "credentials_not_configured", d
          print("OK: dosya yokken graceful unavailable.")
          ' || exit 1
          rm -rf "${TMPHOME}"
          CHECK

      - name: Test betiğini VM'e kopyala
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          scp ${SSH_OPTS} -i "${SSH_KEY}" -P 2222 hyprland-test.sh root@127.0.0.1:/root/hyprland-test.sh
          # hyprland.conf ARTIK KOPYALANMIYOR: Containerfile Katman 4 onu
          # imaja /etc/skel/.config/hypr/hyprland.conf olarak gömüyor.
          # Hyprland'ın root olarak arayacağı konuma imajın KENDİ dosyasını
          # koyuyoruz — böylece aşağıdaki config doğrulaması (border_size,
          # rounding, blur:passes, ...) gerçekten imajdaki dosyayı test ediyor.
          # (Test root olarak çalışıyor; /etc/skel sadece YENİ hesaplara
          # kopyalanır, root zaten mevcut olduğundan elle kopyalamak gerekiyor.)
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 \
            "mkdir -p /root/.config/hypr && cp /etc/skel/.config/hypr/hyprland.conf /root/.config/hypr/hyprland.conf"
          # shell/ ARTIK KOPYALANMIYOR: Containerfile Katman 7 onu imaja
          # /usr/share/navigator/shell/ altına koyuyor. Bununla birlikte bu
          # workflow'da runner'dan VM'e kopyalanan tek şey test betiğinin
          # kendisi kaldı — test edilen her Navigator bileşeni imajdan geliyor.
          # ai-stack ARTIK KOPYALANMIYOR: image/Containerfile Katman 5 onu
          # gerçekten imaja gömüyor, /usr/share/navigator/ai-stack/ altına.
          # Daha önce burada scp + `rpm-ostree usroverlay` ile CI'a özel bir
          # taklit vardı; artık test gerçek üretim yolunu, /usr salt-okunur
          # haldeyken doğruluyor (bkz. sonraki adım).

      - name: ai-stack'in imajın kendisinde olduğunu doğrula (/usr salt-okunur)
        run: |
          set -euo pipefail
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          # Bu adımın tek amacı, ai-stack'in CI tarafından kopyalanmış değil
          # imajda katmanlanmış olduğunu kanıtlamak. Üç şeyi birlikte
          # gösteriyor: (1) /usr gerçekten salt-okunur (yani hiçbir
          # usroverlay/scp devrede değil), (2) altı modülün tamamı yerinde,
          # (3) bytecode build sırasında üretilmiş (compileall katmanı).
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 'bash -s' <<'CHECK'
          set -u
          echo "=== /usr yazılabilir mi? (salt-okunur OLMASI bekleniyor) ==="
          findmnt -no OPTIONS /usr || true
          if touch /usr/share/navigator/.write-probe 2>/dev/null; then
            rm -f /usr/share/navigator/.write-probe
            echo "HATA: /usr yazılabilir — bu test artık gerçek imajı doğrulamıyor olabilir."
            exit 1
          fi
          echo "OK: /usr salt-okunur, dolayısıyla aşağıdaki her şey imajdan geliyor."

          echo "=== ai-stack modülleri ==="
          ls -la /usr/share/navigator/ai-stack/
          MISSING=0
          for m in hardware-probe local-runtime cloud-bridge mcp-tools router assistant; do
            if [ -f "/usr/share/navigator/ai-stack/$m/pyproject.toml" ]; then
              echo "OK: $m"
            else
              echo "HATA: $m imajda yok"
              MISSING=1
            fi
          done
          [ "$MISSING" -eq 0 ] || exit 1

          echo "=== tests/ ve .env* imaja SIZMAMIŞ olmalı ==="
          if find /usr/share/navigator/ai-stack -name 'tests' -o -name '.env*' | grep -q .; then
            echo "HATA: imajda istenmeyen dosyalar var:"
            find /usr/share/navigator/ai-stack -name 'tests' -o -name '.env*'
            exit 1
          fi
          echo "OK: sadece çalışma zamanı kodu var."

          echo "=== build sırasında derlenmiş bytecode (salt-okunur /usr için) ==="
          PYC_COUNT="$(find /usr/share/navigator/ai-stack -name '*.pyc' | wc -l)"
          echo "pyc sayısı: ${PYC_COUNT}"
          if [ "$PYC_COUNT" -eq 0 ]; then
            echo "HATA: hiç .pyc yok — compileall katmanı çalışmamış."
            exit 1
          fi

          echo "=== .pyc'ler çalışma zamanında GERÇEKTEN kullanılıyor mu ==="
          # Sadece .pyc'lerin varlığını saymak yetmez: ostree mtime'ları
          # normalize ettiği için timestamp tabanlı bir .pyc "bayat" sayılır
          # ve salt-okunur /usr'da her çağrıda yeniden derlenirdi (yerelde
          # python3 -v ile doğrulandı). checked-hash'in bu imajda gerçekten
          # işe yaradığını python3 -v çıktısıyla kanıtlıyoruz.
          IMPORT_V="$(cd /usr/share/navigator/ai-stack/router && python3 -v -c 'import router.decision' 2>&1 || true)"
          if echo "$IMPORT_V" | grep -q "bytecode is stale"; then
            echo "HATA: bytecode bayat sayılıyor — checked-hash beklendiği gibi çalışmıyor:"
            echo "$IMPORT_V" | grep -E "bytecode is stale|could not create" | head -5
            exit 1
          fi
          echo "$IMPORT_V" | grep -E "router/__pycache__" | head -3
          echo "OK: .pyc'ler kullanılıyor, çalışma zamanında yeniden derleme yok."

          echo "=== modüller imajdaki yolundan gerçekten çalışıyor mu ==="
          # Argümansız çağrılar durum raporu basıyor (bkz. ilgili
          # __main__.py docstring'leri). local_runtime'ın durum raporu kendi
          # ../hardware-probe kardeşini subprocess olarak çalıştırıyor,
          # router --decide-only ise ../local-runtime'ı — yani bu iki çağrı
          # imajdaki düz kardeş hiyerarşisinin gerçekten çözüldüğünü de
          # kanıtlıyor. mcp_tools bir sunucu (çağrılırsa bloklar) ve
          # assistant tam zinciri istiyor; ikisi için import kontrolü
          # yapılıyor — bu da .pyc'lerin gerçekten yüklenebildiğini gösterir.
          FAIL=0
          run_mod() {
            dir="$1"; shift
            printf '  %s: ' "$dir"
            if (cd "/usr/share/navigator/ai-stack/$dir" && "$@" >/tmp/aistack.out 2>/tmp/aistack.err); then
              head -c 300 /tmp/aistack.out; echo
            else
              echo "HATA (exit=$?)"; cat /tmp/aistack.err; FAIL=1
            fi
          }
          run_mod hardware-probe python3 -m hardware_probe
          run_mod local-runtime  python3 -m local_runtime
          run_mod cloud-bridge   python3 -m cloud_bridge
          run_mod router         python3 -m router --decide-only --prompt "test"
          run_mod mcp-tools      python3 -c "import mcp_tools.server, mcp_tools.tools, mcp_tools.hyprland, mcp_tools.http_transport; print('import OK')"
          run_mod assistant      python3 -c "import assistant.conversation, assistant.mcp_client; print('import OK')"
          [ "$FAIL" -eq 0 ] || exit 1
          echo "OK: ai-stack imajdaki gerçek yolundan çalışıyor."
          CHECK

      - name: DRM/GPU cihazlarını VM içinde listele (teşhis için)
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 \
            "ls -la /dev/dri/ 2>&1; echo ---; lspci | grep -i vga; echo ---; which Hyprland python3 qs; echo ---; rpm -q seatd libseat quickshell 2>&1; which seatd 2>&1; echo ---; echo XDG_SESSION_ID=\$XDG_SESSION_ID; loginctl 2>&1 || true"

      - name: ai-stack/router'ı doğrudan SSH ile test et (Quickshell'siz teşhis)
        run: |
          # AssistantPanel.qml'in Process'ini devreye sokmadan, aynı komutu
          # düz SSH ile çalıştırarak ai-stack/router'ın (ve ../local-runtime,
          # ../hardware-probe göreli bağımlılıklarının) VM'de tek başına
          # çalıştığını doğruluyor — bir sorun çıkarsa Quickshell'in süreç
          # başlatma mekanizmasından mı yoksa ai-stack'in kendisinden mi
          # geldiğini hızlıca ayırt etmeye yarıyor.
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 \
            "ls -la /usr/share/navigator/ai-stack/router/ 2>&1; echo ---; cd /usr/share/navigator/ai-stack/router && time python3 -m router --prompt 'test' --pretty; echo \"exit=\$?\""

      - name: Hyprland'ı gerçekten başlat, mcp-tools ve Quickshell'i test et
        run: |
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          ssh ${SSH_OPTS} -i "${SSH_KEY}" -p 2222 root@127.0.0.1 "bash /root/hyprland-test.sh"

      - name: VM'i temizle
        if: always()
        run: |
          if [ -f qemu.pid ]; then
            PID="$(cat qemu.pid)"
            kill "${PID}" 2>/dev/null || true
            sleep 2
            kill -9 "${PID}" 2>/dev/null || true
          fi
          cat qemu.log || true
