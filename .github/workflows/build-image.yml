# Navigator OS — Image Build & Push Pipeline (Phase 1 draft)
#
# This workflow builds image/Containerfile on GitHub's own runner
# (GitHub-hosted, free/shared resources) and pushes it to the ghcr.io container
# registry. The heavy build/compose operation is NOT RUN locally — that is a
# pipeline started by a manual trigger (workflow_dispatch) or a push to main;
# started; the decision to trigger it belongs to the project owner.

name: Build Navigator Image

on:
  workflow_dispatch: {}
  push:
    # TEMPORARY (diag/build-storage): lets the fix be measured on a branch
    # before it reaches main. Removed before merge.
    branches: [main, "diag/**"]
    paths:
      - "image/Containerfile"
      # Layer 4's /etc/skel templates (the credential file).
      - "image/skel/**"
      # theme/palette.json (Layer 3) and hyprland/hyprland.conf (Layer 4)
      # is now genuinely copied into the image.
      - "theme/**"
      - "hyprland/**"
      # ai-stack/ is now genuinely copied into the image (Containerfile Layer 5),
      # so a change in ai-stack makes the image stale.
      - "ai-stack/**"
      # shell/*.qml likewise (Layer 7).
      - "shell/**"
      - ".github/workflows/build-image.yml"
      - ".github/storage.conf"

env:
  IMAGE_NAME: navigator
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
  # Why the build does not use the runner's own container storage
  # configuration is written down in .github/storage.conf. It is set at the
  # workflow level so that the build, the login and the push all address the
  # same image store; a step that missed it would look for the image in a
  # different place and fail to find what was just built.
  CONTAINERS_STORAGE_CONF: ${{ github.workspace }}/.github/storage.conf

# Two guards this workflow was missing while build-disk-and-boot-test.yml had
# both.
#
# concurrency is the one that matters for correctness: without it, two pushes
# in quick succession start two builds, and if the older one finishes last it
# pushes a STALE :latest over the newer image. Nothing downstream would notice
# — the tag would simply be wrong, and the next boot test would verify the
# wrong thing while passing. cancel-in-progress is right here because :latest
# should be whatever main is now, not whichever build happened to finish last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    # Real builds take 8-9 minutes, including the Ollama layer. With no
    # timeout at all a stuck build runs to GitHub's 6-hour default, which is
    # how a single wedged runner turns into an afternoon of billed minutes on
    # a private repo and a very confusing wait on a public one. 45 minutes is
    # generous against a slow mirror and still nowhere near six hours.
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      # Diagnostic, not an assertion, and deliberately so. The first attempt at
      # this step asserted that `buildah info` reports no mount program — and
      # it turned out that `buildah info` does not report a mount program that
      # comes from storage.conf at all, not even the runner's own. The check
      # was measuring nothing, which its own positive control caught (run
      # 32085405848). What the build actually needs guarding is its duration,
      # so that assertion lives on the build step below, where the number being
      # checked is measured rather than inferred.
      #
      # Both configurations are printed because the difference between them is
      # the whole subject: ours is .github/storage.conf, the control is the
      # runner's, and the GraphStatus of each says which overlay implementation
      # the driver ended up with.
      - name: Record the container storage configuration
        run: |
          set -euo pipefail

          echo "== this build (.github/storage.conf)"
          buildah info

          echo
          echo "== the runner's own configuration, for comparison"
          control_root="$RUNNER_TEMP/storage-control"
          mkdir -p "$control_root/root" "$control_root/runroot"
          env -u CONTAINERS_STORAGE_CONF buildah \
            --root "$control_root/root" --runroot "$control_root/runroot" \
            info

      # buildah is called directly rather than through redhat-actions/buildah-build.
      # The action reads the storage driver out of the runner's configuration and,
      # when it is overlay, exports STORAGE_OPTS to force fuse-overlayfs — which
      # is precisely what the build must not do, and the action offers no way to
      # decline. It is also deprecated in favour of a v3 that behaves the same.
      - name: Build image
        id: build_image
        run: |
          set -euo pipefail
          start=$SECONDS
          buildah build \
            --format oci \
            --tls-verify=true \
            --layers=true \
            -f image/Containerfile \
            -t "${IMAGE_NAME}:latest" \
            .
          # buildah 1.33's --tag takes a single name, so the second tag is
          # applied afterwards rather than during the build.
          buildah tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${GITHUB_SHA}"
          seconds=$(( SECONDS - start ))
          echo "seconds=$seconds" >> "$GITHUB_OUTPUT"
          echo "built in ${seconds}s"

          # The FUSE regression did not fail anything. It made a 8-9 minute
          # build take over 45, and the only reason it was noticed at all is
          # that a human looked at a run that was still going. The 45 minute
          # job timeout catches the extreme case; this catches the merely
          # ruinous one, and it does it on a number that was measured rather
          # than on a configuration field that may or may not mean what it
          # looks like. Every successful build so far: 8m06s, 8m40s, 8m41s.
          if [ "$seconds" -gt 1200 ]; then
            echo "::error::The build took ${seconds}s. Successful builds take 500-550s, and the layer-through-FUSE regression took over 2700s. Something has put the layer commits back on a slow path — start with the storage configuration printed above."
            exit 1
          fi

      # Pushing is limited to main. A build from any other branch is worth
      # running — it proves the Containerfile still builds — but :latest must
      # keep meaning "what main is now", and the old condition let anything
      # that was not a pull request overwrite it.
      - name: Log in to ghcr.io
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | buildah login --username "${{ github.actor }}" --password-stdin ghcr.io

      - name: Push to ghcr.io
        id: push
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for tag in latest "$GITHUB_SHA"; do
            buildah push --format oci \
              "${IMAGE_NAME}:${tag}" \
              "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Navigator image"
            echo
            echo "Built in ${{ steps.build_image.outputs.seconds }}s."
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo
              echo "Pushed:"
              echo
              echo "- \`${IMAGE_REGISTRY}/${IMAGE_NAME}:latest\`"
              echo "- \`${IMAGE_REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}\`"
            else
              echo
              echo "Not pushed: pushing is limited to main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
